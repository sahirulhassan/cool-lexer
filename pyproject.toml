[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cool-lexer"
version = "0.1.0"
description = "Lexical analyzer for COOL (Classroom Object Oriented Language)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.4",
]

[project.scripts]
cool-lexer = "cool_lexer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cool_lexer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.112",
]
